<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Generator (Socket.IO)</title>
    <!-- Simple Google Fonts import -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-badge.connected {
            background-color: #dcfce7;
            color: #166534;
        }

        .status-badge.disconnected {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .input-section {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            border: 1px solid var(--border-color);
        }

        .input-group {
            display: flex;
            gap: 1rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: var(--text-secondary);
            cursor: not-allowed;
        }

        .output-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card.hidden {
            display: none;
        }

        .card-header {
            padding: 1rem 1.5rem;
            background: #f1f5f9;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .card-body {
            padding: 1.5rem;
            overflow-x: auto;
        }

        pre {
            background: #1e293b;
            color: #f8fafc;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0;
            font-size: 0.9rem;
        }

        .markdown-body {
            line-height: 1.6;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th,
        td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
            background: #f8fafc;
        }

        /* Spinner for loading state (optional) */
        .loading {
            width: 1.5rem;
            height: 1.5rem;
            border: 2px solid #e2e8f0;
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        #log-container {
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 0.5rem;
        }

        .log-entry {
            margin-bottom: 0.25rem;
        }

        .log-info {
            color: var(--text-secondary);
        }

        .log-error {
            color: var(--error-color);
        }

        .log-success {
            color: var(--success-color);
        }
    </style>
    <!-- Socket.IO Client Library -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>

    <div class="container">
        <header>
            <h1>Report Generator</h1>
            <div id="connection-status" class="status-badge disconnected">Disconnected</div>
        </header>

        <div class="input-section">
            <div class="input-group">
                <input type="text" id="user-prompt" placeholder="Ask a question about the database..."
                    autocomplete="off">
                <button id="send-btn" disabled>Send</button>
            </div>
        </div>

        <div class="output-section">

            <!-- Progress/Logs -->
            <div class="card">
                <div class="card-header">Activity Log</div>
                <div class="card-body">
                    <div id="log-container"></div>
                </div>
            </div>

            <!-- SQL String -->
            <div id="sql-card" class="card hidden">
                <div class="card-header">Generated SQL</div>
                <div class="card-body">
                    <pre id="sql-content"></pre>
                </div>
            </div>

            <!-- Data Table -->
            <div id="data-card" class="card hidden">
                <div class="card-header">Data Preview</div>
                <div class="card-body">
                    <div id="table-container"></div>
                </div>
            </div>

            <!-- Report -->
            <div id="report-card" class="card hidden">
                <div class="card-header">Report</div>
                <div class="card-body">
                    <div id="report-content" class="markdown-body"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const statusEl = document.getElementById('connection-status');
        const promptInput = document.getElementById('user-prompt');
        const sendBtn = document.getElementById('send-btn');
        const logContainer = document.getElementById('log-container');

        const sqlCard = document.getElementById('sql-card');
        const sqlContent = document.getElementById('sql-content');

        const dataCard = document.getElementById('data-card');
        const tableContainer = document.getElementById('table-container');

        const reportCard = document.getElementById('report-card');
        const reportContent = document.getElementById('report-content');

        let socket;

        function connect() {
            log('System', 'Connecting to Socket.IO...', 'info');

            // Connect to the server
            socket = io(); // Defaults to window.location

            socket.on('connect', () => {
                statusEl.textContent = 'Connected';
                statusEl.className = 'status-badge connected';
                sendBtn.disabled = false;
                log('System', 'Socket.IO connected.', 'success');
            });

            socket.on('disconnect', () => {
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'status-badge disconnected';
                sendBtn.disabled = true;
                log('System', 'Socket.IO disconnected.', 'error');
            });

            socket.on('connect_error', (err) => {
                console.error('Connection Error', err);
                log('System', 'Connection error: ' + err.message, 'error');
            });

            // Custom Events
            socket.on('status', (data) => {
                log('Server', data.message, 'info');
            });

            socket.on('error', (data) => {
                log('Error', data.message, 'error');
            });

            socket.on('sql', (data) => {
                showSql(data.content);
            });

            socket.on('data', (data) => {
                showData(data.content);
            });

            socket.on('report', (data) => {
                showReport(data.content);
            });
        }

        function sendMessage() {
            const text = promptInput.value.trim();
            if (!text) return;

            // Clear previous results
            resetUI();

            log('User', text, 'info');
            // Emit user event
            socket.emit('user_prompt', { prompt: text });
        }

        function resetUI() {
            sqlCard.classList.add('hidden');
            dataCard.classList.add('hidden');
            reportCard.classList.add('hidden');
            sqlContent.textContent = '';
            tableContainer.innerHTML = '';
            reportContent.textContent = '';
        }

        function showSql(sql) {
            sqlCard.classList.remove('hidden');
            sqlContent.textContent = sql;
        }

        function showData(data) {
            dataCard.classList.remove('hidden');
            if (!data || data.length === 0) {
                tableContainer.innerHTML = '<p>No data returned.</p>';
                return;
            }

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const tbody = document.createElement('tbody');

            // Headers
            const headers = Object.keys(data[0]);
            const trHead = document.createElement('tr');
            headers.forEach(h => {
                const th = document.createElement('th');
                th.textContent = h;
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            // Rows
            data.forEach(row => {
                const tr = document.createElement('tr');
                headers.forEach(h => {
                    const td = document.createElement('td');
                    td.textContent = row[h] !== null ? row[h] : '';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            table.appendChild(thead);
            table.appendChild(tbody);
            tableContainer.appendChild(table);
        }

        function showReport(markdown) {
            reportCard.classList.remove('hidden');
            // Simple line-break to <br> for now, or just text. 
            reportContent.innerHTML = markdown.replace(/\n/g, '<br>');
        }

        function log(source, message, type) {
            const div = document.createElement('div');
            div.className = `log-entry log-${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${source}: ${message}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);
        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Start
        connect();

    </script>
</body>

</html>
