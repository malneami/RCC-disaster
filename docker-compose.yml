version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rcc-postgres
    restart: always
    environment:
      POSTGRES_DB: rcc_healthcare
      POSTGRES_USER: rcc_admin
      POSTGRES_PASSWORD: healthcare_secure_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rcc_network

  redis:
    image: redis:7-alpine
    container_name: rcc-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rcc_network

  osrm-backend:
    image: osrm/osrm-backend
    container_name: rcc-osrm
    restart: always
    ports:
      - "5001:5000"
    volumes:
      - ./docker/osrm:/data
    command: osrm-routed --algorithm mld /data/custom_region.osrm
    networks:
      - rcc_network

  livekit:
    image: livekit/livekit-server:latest
    container_name: rcc-livekit
    command: >
      --dev --bind 0.0.0.0 --port 7880
    environment:
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    ports:
      - "7880:7880"
    networks:
      - rcc_network

volumes:
  postgres_data:
  redis_data:

networks:
  rcc_network:
    driver: bridge